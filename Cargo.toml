[package]
name = "menyoki"
version = "1.8.0"
rust-version = "1.88"
description = "Screen{shot,cast} and perform ImageOps on the command line"
authors = ["Orhun Parmaksız <orhunparmaksiz@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
documentation = "https://github.com/orhun/menyoki/blob/master/README.md"
homepage = "https://menyoki.cli.rs"
repository = "https://github.com/orhun/menyoki"
keywords = ["screenshot", "screencast", "gif", "recorder", "image"]
categories = ["multimedia", "graphics", "command-line-utilities"]
include = ["src/**/*", "Cargo.*", "LICENSE", "README.md", "CHANGELOG.md"]
edition = "2021"

[features]
default = ["ski"]
# enable gifski encoder
ski = ["gifski", "rgb", "imgref"]
# enable support for viewing sixel images
sixel = ["viuer/sixel"]
# run window system tests
test-ws = []

# Windows dependencies
[target.'cfg(windows)'.dependencies]

# MacOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]

# Linux dependencies
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11 = { version = "2.21.0", features = ["xlib", "xrandr"] }
# pure-Rust backend by default, so no libwayland is needed to build
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-hyprland = { version = "1.2.0", features = ["client"] }

[dependencies]
# window system
device_query = "1.1.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
# image operations
image = { version = "0.25.10", default-features = false, features = [
    "bmp", "exr", "ff", "gif", "ico", "jpeg", "png", "pnm", "rayon",
    "tga", "tiff", "webp",
] }
webp = { version = "0.3.1", default-features = false }
imgref = { version = "1.12.3", optional = true }
rgb = { version = "0.8.53", optional = true }
png = "0.18.1"
gif = "0.14.2"
kamadak-exif = "0.6.1"
dominant_color = "0.4.0"
viuer = "0.11.0"
# utility
dirs = "6.0.0"
rust-ini = "0.21.3"
chrono = "0.4.45"
hex = "0.4.3"
bytesize = "2.7.0"
natord = "1.0.9"
colored = "2.2.0"
log = "0.4.34"
fern_colored = { version = "0.6.1", features = ["colored"] }
thiserror = "2.0.20"
shellexpand = "3.1.2"

[dependencies.gifski]
version = "1.34.0"
default-features = false
features = ["png"]
optional = true

[dependencies.clap]
version = "2.34.0"
default-features = false
features = ["suggestions", "color", "wrap_help"]

[dev-dependencies]
pretty_assertions = "1.4.1"

# metadata for cargo-binstall to get the right artifacts
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.dev]
opt-level = 2
debug = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = false
